<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayvonlar Dunyosi — Mozaika O'yini</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2D6A4F;
    --primary-light: #52B788;
    --accent: #F4A261;
    --accent2: #E76F51;
    --sky: #48CAE4;
    --sky-dark: #0077B6;
    --bg: #F8FFF4;
    --card-back: #2D6A4F;
    --card-front: #fff;
    --shadow: 0 8px 32px rgba(45,106,79,0.13);
    --radius: 18px;
    --gold: #FFD166;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(82,183,136,0.13) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(72,202,228,0.13) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(244,162,97,0.07) 0%, transparent 60%);
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    padding: 32px 20px 16px;
    position: relative;
  }
  .header-badge {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(28px, 5vw, 52px);
    color: var(--primary);
    line-height: 1.1;
    letter-spacing: 1px;
  }
  header h1 span { color: var(--accent2); }
  header p {
    color: #6b8f71;
    font-size: 15px;
    margin-top: 6px;
    font-weight: 600;
  }

  /* ===== STATS BAR ===== */
  .stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 20px 16px;
  }
  .stat {
    background: #fff;
    border-radius: 14px;
    padding: 10px 22px;
    box-shadow: var(--shadow);
    text-align: center;
    min-width: 90px;
    border: 2px solid rgba(45,106,79,0.08);
  }
  .stat-label { font-size: 11px; font-weight: 700; color: #8fac93; text-transform: uppercase; letter-spacing: 1px; }
  .stat-val { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--primary); line-height: 1.1; }

  /* ===== LEVEL BUTTONS ===== */
  .levels {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 0 20px 18px;
  }
  .lvl-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 13px;
    padding: 8px 20px;
    border-radius: 30px;
    border: 2.5px solid var(--primary-light);
    background: #fff;
    color: var(--primary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .lvl-btn:hover { background: var(--primary-light); color: #fff; transform: translateY(-2px); }
  .lvl-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 16px rgba(45,106,79,0.25); }

  /* ===== HINT BAR ===== */
  .hint-bar {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    background: rgba(82,183,136,0.12);
    border-radius: 12px;
    padding: 9px 20px;
    max-width: 500px;
    margin: 0 auto 18px;
    min-height: 38px;
    transition: all 0.3s;
    border: 1.5px solid rgba(82,183,136,0.2);
  }

  /* ===== BOARD ===== */
  #board {
    display: grid;
    gap: 12px;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px 20px;
  }

  /* ===== CARD ===== */
  .card-outer {
    perspective: 600px;
    cursor: pointer;
  }
  .card-inner {
    width: 100%;
    aspect-ratio: 1;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,2,.6,1);
    border-radius: var(--radius);
  }
  .card-outer.flipped .card-inner,
  .card-outer.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Back face */
  .card-back {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    box-shadow: 0 6px 20px rgba(45,106,79,0.2);
    border: 3px solid rgba(255,255,255,0.18);
  }
  .card-back .back-icon {
    font-size: clamp(22px, 4vw, 36px);
    opacity: 0.7;
  }
  .card-back::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 12px;
    border: 2px dashed rgba(255,255,255,0.25);
  }

  /* Front face */
  .card-front {
    background: #fff;
    transform: rotateY(180deg);
    box-shadow: 0 6px 20px rgba(45,106,79,0.13);
    border: 3px solid rgba(82,183,136,0.2);
    flex-direction: column;
    gap: 4px;
    padding: 6px;
  }
  .card-outer.matched .card-front {
    background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
    border-color: var(--primary-light);
  }
  .animal-emoji {
    font-size: clamp(32px, 7vw, 64px);
    line-height: 1;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12));
    transition: transform 0.3s;
  }
  .card-outer.matched .animal-emoji {
    animation: bounce 0.5s ease;
  }
  @keyframes bounce {
    0%,100%{transform:scale(1)} 40%{transform:scale(1.22)} 70%{transform:scale(0.93)}
  }
  .animal-name-tag {
    font-size: clamp(10px, 1.8vw, 14px);
    font-weight: 800;
    color: var(--primary);
    text-align: center;
    background: rgba(45,106,79,0.08);
    border-radius: 8px;
    padding: 2px 8px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-outer.matched .animal-name-tag {
    background: rgba(45,106,79,0.18);
    color: var(--primary);
  }

  /* Shake animation */
  .card-outer.shake .card-inner {
    animation: shake 0.38s ease;
  }
  @keyframes shake {
    0%,100%{transform:rotateY(180deg) translateX(0)}
    25%{transform:rotateY(180deg) translateX(-7px)}
    75%{transform:rotateY(180deg) translateX(7px)}
  }

  /* ===== BUTTONS ===== */
  .btn-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 4px 20px 30px;
  }
  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    padding: 11px 28px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.15); }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-accent { background: var(--accent); color: #fff; }

  /* ===== WIN OVERLAY ===== */
  .win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .win-overlay.show { display: flex; }
  .win-box {
    background: #fff;
    border-radius: 28px;
    padding: 44px 48px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 24px 80px rgba(0,0,0,0.22);
    animation: popIn 0.4s cubic-bezier(.4,2,.6,1);
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .win-trophy { font-size: 64px; margin-bottom: 8px; }
  .win-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--primary); margin-bottom: 8px; }
  .win-stars { font-size: 28px; margin-bottom: 12px; }
  .win-stats { font-size: 14px; color: #6b8f71; font-weight: 700; margin-bottom: 24px; line-height: 2; }
  .win-stats span { color: var(--primary); font-size: 18px; font-family: 'Fredoka One', cursive; }
  .win-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    padding: 13px 36px;
    border-radius: 30px;
    border: none;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(45,106,79,0.3);
    transition: all 0.2s;
  }
  .win-btn:hover { background: var(--primary-light); transform: translateY(-2px); }

  /* ===== CONFETTI ===== */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 16px;
    top: -20px;
    border-radius: 3px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 300;
  }
  @keyframes fall {
    to { top: 110vh; transform: rotate(720deg) translateX(80px); }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 480px) {
    #board { gap: 8px; padding: 0 10px 16px; }
    .win-box { padding: 32px 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">3-sinf · Tabiat darsi</div>
  <h1>🌿 Hayvonlar <span>Dunyosi</span></h1>
  <p>Kartalarni ochib, juft hayvonlarni toping!</p>
</header>

<div class="stats">
  <div class="stat"><div class="stat-label">Juftlar</div><div class="stat-val" id="s-matched">0</div></div>
  <div class="stat"><div class="stat-label">Urinish</div><div class="stat-val" id="s-tries">0</div></div>
  <div class="stat"><div class="stat-label">Vaqt</div><div class="stat-val" id="s-timer">0:00</div></div>
  <div class="stat"><div class="stat-label">Yulduz</div><div class="stat-val" id="s-stars">⭐⭐⭐</div></div>
</div>

<div class="levels">
  <button class="lvl-btn active" data-cols="4" onclick="setLevel(this)">🌱 Oson (4×4)</button>
  <button class="lvl-btn" data-cols="6" onclick="setLevel(this)">🌿 O'rta (6×6)</button>
  <button class="lvl-btn" data-cols="8" onclick="setLevel(this)">🌳 Qiyin (8×8)</button>
</div>

<div class="hint-bar" id="hint">🐾 Kartani bosing va juft toping!</div>
<div id="board"></div>

<div class="btn-row">
  <button class="btn btn-primary" onclick="restartGame()">🔄 Qayta boshlash</button>
  <button class="btn btn-accent" onclick="useHint()">💡 Yordam</button>
</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-box">
    <div class="win-trophy">🏆</div>
    <div class="win-title">Barakalla!</div>
    <div class="win-stars" id="win-stars">⭐⭐⭐</div>
    <div class="win-stats" id="win-stats"></div>
    <button class="win-btn" onclick="closeWin()">🎮 Yana o'yna!</button>
  </div>
</div>

<script>
const ANIMALS = [
  {e:'🐶',n:'Kuchuk'},{e:'🐱',n:'Mushuk'},{e:'🐻',n:'Ayiq'},{e:'🐼',n:'Panda'},
  {e:'🐨',n:'Koala'},{e:'🦁',n:'Sher'},{e:'🐯',n:'Yo\'lbars'},{e:'🦊',n:'Tulki'},
  {e:'🐸',n:'Qurbaqa'},{e:'🐧',n:'Pingvin'},{e:'🦋',n:'Kapalak'},{e:'🐢',n:'Toshbaqa'},
  {e:'🦜',n:'To\'ti'},{e:'🐬',n:'Delfin'},{e:'🐘',n:'Fil'},{e:'🦒',n:'Jirafa'},
  {e:'🐍',n:'Ilon'},{e:'🦅',n:'Burgut'},{e:'🐊',n:'Timsoh'},{e:'🦓',n:'Zebra'},
  {e:'🐙',n:'Ahtapot'},{e:'🦈',n:'Akula'},{e:'🐝',n:'Asalari'},{e:'🦔',n:'Kirpi'},
  {e:'🐇',n:'Quyon'},{e:'🐿',n:'Olmaxon'},{e:'🦌',n:'Bug\'u'},{e:'🦩',n:'Flamingo'},
  {e:'🐠',n:'Baliq'},{e:'🦀',n:'Qisqichbaqa'},{e:'🐳',n:'Kit'},{e:'🦘',n:'Kenguru'},
];

let gridCols = 4, cards = [], flipped = [], matchedCount = 0, tries = 0;
let canFlip = true, timerInterval = null, seconds = 0, hintUsed = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function setLevel(btn) {
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  gridCols = parseInt(btn.dataset.cols);
  restartGame();
}

function restartGame() {
  clearInterval(timerInterval);
  seconds = 0; tries = 0; matchedCount = 0; flipped = []; canFlip = true; hintUsed = false;
  const pairCount = (gridCols * gridCols) / 2;
  const used = shuffle(ANIMALS).slice(0, pairCount);
  cards = shuffle([...used, ...used]).map((a, i) => ({ ...a, id: i, flipped: false, matched: false }));
  updateStats();
  renderBoard();
  timerInterval = setInterval(() => {
    seconds++;
    updateTimer();
    updateStars();
  }, 1000);
  setHint('🐾 Kartani bosing va juft toping!');
}

function updateTimer() {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  document.getElementById('s-timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
}

function updateStats() {
  document.getElementById('s-matched').textContent = matchedCount;
  document.getElementById('s-tries').textContent = tries;
}

function updateStars() {
  const total = cards.length / 2;
  const ratio = tries > 0 ? matchedCount / tries : 1;
  let stars = '⭐⭐⭐';
  if (seconds > total * 10 || ratio < 0.5) stars = '⭐';
  else if (seconds > total * 6 || ratio < 0.7) stars = '⭐⭐';
  document.getElementById('s-stars').textContent = stars;
}

function setHint(msg) { document.getElementById('hint').textContent = msg; }

function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  board.innerHTML = '';
  cards.forEach((c, i) => {
    const outer = document.createElement('div');
    outer.className = 'card-outer' + (c.flipped ? ' flipped' : '') + (c.matched ? ' matched' : '');
    outer.id = 'card-' + i;
    outer.onclick = () => flipCard(i);
    outer.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="back-icon">🌿</div>
        </div>
        <div class="card-face card-front">
          <div class="animal-emoji">${c.e}</div>
          <div class="animal-name-tag">${c.n}</div>
        </div>
      </div>`;
    board.appendChild(outer);
  });
}

function flipCard(i) {
  if (!canFlip || cards[i].matched || cards[i].flipped || flipped.length === 2) return;
  cards[i].flipped = true;
  flipped.push(i);
  document.getElementById('card-' + i).classList.add('flipped');
  if (flipped.length === 2) {
    tries++;
    updateStats();
    canFlip = false;
    setTimeout(checkMatch, 950);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  if (cards[a].e === cards[b].e) {
    cards[a].matched = cards[b].matched = true;
    matchedCount++;
    [a, b].forEach(idx => {
      const el = document.getElementById('card-' + idx);
      el.classList.add('matched');
    });
    updateStats();
    updateStars();
    setHint('✅ Ajoyib! ' + cards[a].n + ' topildi! 🎉');
    if (matchedCount === cards.length / 2) {
      clearInterval(timerInterval);
      setTimeout(showWin, 600);
    }
  } else {
    [a, b].forEach(idx => {
      cards[idx].flipped = false;
      const el = document.getElementById('card-' + idx);
      el.classList.add('shake');
      setTimeout(() => {
        el.classList.remove('flipped', 'shake');
      }, 400);
    });
    setHint('❌ Mos kelmadi, yana urinib ko\'ring!');
  }
  flipped = [];
  canFlip = true;
}

function useHint() {
  if (hintUsed) { setHint('⚠️ Yordam faqat bir marta ishlatiladi!'); return; }
  hintUsed = true;
  const unmatched = cards.map((c, i) => ({ ...c, i })).filter(c => !c.matched && !c.flipped);
  if (unmatched.length < 2) return;
  const pick = unmatched[Math.floor(Math.random() * unmatched.length)];
  const pair = unmatched.find(c => c.i !== pick.i && c.e === pick.e);
  if (!pair) return;
  [pick.i, pair.i].forEach(idx => {
    const el = document.getElementById('card-' + idx);
    el.style.filter = 'brightness(1.3) drop-shadow(0 0 12px #FFD166)';
    setTimeout(() => el.style.filter = '', 1400);
  });
  setHint('💡 Sariq yonayotgan kartalarni ko\'rdingizmi?');
}

function showWin() {
  const total = cards.length / 2;
  const ratio = tries > 0 ? matchedCount / tries : 1;
  let stars = '⭐⭐⭐';
  if (seconds > total * 10 || ratio < 0.5) stars = '⭐';
  else if (seconds > total * 6 || ratio < 0.7) stars = '⭐⭐';
  const m = Math.floor(seconds / 60), s = seconds % 60;
  document.getElementById('win-stars').textContent = stars;
  document.getElementById('win-stats').innerHTML =
    `Urinishlar: <span>${tries}</span><br>Vaqt: <span>${m}:${s < 10 ? '0' : ''}${s}</span><br>Juftlar: <span>${total}</span>`;
  document.getElementById('win-overlay').classList.add('show');
  launchConfetti();
}

function closeWin() {
  document.getElementById('win-overlay').classList.remove('show');
  restartGame();
}

function launchConfetti() {
  const colors = ['#2D6A4F','#52B788','#F4A261','#E76F51','#48CAE4','#FFD166'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${1.2 + Math.random() * 1.8}s;
        animation-delay: ${Math.random() * 0.5}s;
        transform: rotate(${Math.random() * 360}deg);
        width: ${7 + Math.random() * 8}px;
        height: ${12 + Math.random() * 10}px;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i * 30);
  }
}

restartGame();
</script>
</body>
</html>
